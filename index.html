<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кейтопедия — словарь наших мудростей и затупов</title>
  <meta name="description" content="Кейтопедия: определения, мудрости и кейторизмы, рождённые в живых беседах.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%238b5cf6'/><text x='32' y='45' font-size='34' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>К</text></svg>">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <!-- Фоновые блобы -->
  <div class="bg" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Шапка -->
  <header class="site-header">
    <div class="container header-inner">
      <button class="logo" id="logoBtn" title="Кейтопедия — на главную">
        <span class="logo-icon">К</span>
        <span class="logo-text">Кейто<span class="grad">педия</span></span>
      </button>
      <p class="header-note">Собрано из заметок Эрика в телефоне.</p>
    </div>
  </header>

  <main class="container">
    <!-- Герой: фото-сцена -->
    <section class="hero">
      <div class="hero-card">
        <div class="hero-bg" aria-hidden="true">
          <img src="assets/photos/hall-1.jpg" alt="">
        </div>
        <div class="hero-tint" aria-hidden="true"></div>

        <div class="hero-inner">
          <h1>Словарь наших мудростей и затупов, копившийся годами</h1>
          <p class="hero-sub" id="typed" data-text="Определения, кейторизмы, штуки, перлы, тупняки, запреты и рубрика «Я мадама» — всё, что мы наговорили."></p>

          <div class="hero-stats" id="stats"></div>
        </div>
      </div>
    </section>

    <!-- Сегмент-контрол разделов -->
    <section class="chipbar">
      <div class="searchbox">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input id="searchInput" type="text" placeholder="Поиск по всему словарю…" autocomplete="off" spellcheck="false">
        <button class="search-clear" id="searchClear" title="Очистить поиск" hidden>✕</button>
      </div>
      <div class="segwrap" id="segWrap">
        <div class="seg-pill" id="segPill" aria-hidden="true"></div>
        <!-- сегменты добавит app.js -->
      </div>
      <button class="add-btn" id="addBtn" title="Добавить новую запись">+</button>
    </section>

    <!-- Карточки -->
    <section class="cards" id="cards" aria-live="polite"></section>

    <!-- Пусто -->
    <div class="empty" id="emptyState" hidden>
      <div class="empty-emoji">🫥</div>
      <p>Ничего не найдено. Такой книги у нас пока нет.</p>
      <button class="btn btn-ghost" id="resetBtn">Сбросить фильтры</button>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Кейтопедия © 2022–<span id="year"></span></p>
    </div>
  </footer>

  <!-- Модальное окно -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal panel-gradient" role="dialog" aria-modal="true" aria-label="Запись словаря">
      <button class="modal-close" id="modalClose" aria-label="Закрыть">×</button>
      <div id="modalContent"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="modalCopy">📋 Скопировать</button>
      </div>
    </div>
  </div>

  <!-- Диалог добавления записи -->
  <div class="modal-backdrop" id="addBackdrop" hidden>
    <div class="modal panel-gradient" role="dialog" aria-modal="true" aria-label="Новая запись">
      <button class="modal-close" id="addClose" aria-label="Закрыть">×</button>
      <div id="addContent">
        <h2 class="modal-term">Новая запись</h2>
        <form id="addForm" class="add-form">
          <label>
            <span>Раздел (выбери существующий или введи новый)</span>
            <div class="combo" id="sectionCombo">
              <input id="addSection" required placeholder="Выбери или введи название раздела" autocomplete="off" spellcheck="false">
              <div class="combo-menu" id="sectionMenu" hidden></div>
            </div>
          </label>
          <label>
            <span>Название *</span>
            <input id="addTerm" required placeholder="Например: Набомбурилось">
          </label>
          <label>
            <span>Описание</span>
            <textarea id="addText" rows="3" placeholder="Формулировка или история"></textarea>
          </label>
          <label>
            <span>Автор</span>
            <input id="addAuthor" placeholder="Кто придумал">
          </label>
          <button type="submit" class="btn btn-add-submit">✅ Добавить</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Диалог подтверждения -->
  <div class="modal-backdrop confirm-backdrop" id="confirmBackdrop" hidden>
    <div class="modal confirm-modal panel-gradient" role="dialog" aria-modal="true" aria-label="Подтверждение">
      <div class="confirm-icon">❓</div>
      <div class="confirm-text" id="confirmText">Добавить новую запись?</div>
      <div class="confirm-actions">
        <button class="btn btn-ghost confirm-btn" id="confirmCancel">Отмена</button>
        <button class="btn btn-primary confirm-btn" id="confirmOk">✅ Добавить</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="site-config.js?v=5"></script>
  <script src="data.js?v=6"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
